name: Update GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

# Prevent overlapping runs of this workflow from pushing at the same time.
concurrency:
  group: update-github-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create output directory
        run: mkdir -p profile

      - name: Generate Stats Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=rfmotaa&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=58A6FF&icon_color=58A6FF&text_color=C9D1D9&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Languages Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=rfmotaa&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=58A6FF&text_color=C9D1D9
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push generated cards
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the generated files safe while syncing the checkout to origin/main.
          mkdir -p "$RUNNER_TEMP/generated-profile"
          cp profile/stats.svg profile/top-langs.svg "$RUNNER_TEMP/generated-profile/"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            mkdir -p profile
            cp "$RUNNER_TEMP/generated-profile/"*.svg profile/

            git add profile/stats.svg profile/top-langs.svg

            if git diff --cached --quiet; then
              echo "Generated cards are already up to date."
              exit 0
            fi

            git commit -m "chore: update GitHub stats"

            if git push origin HEAD:main; then
              echo "Generated cards pushed successfully."
              exit 0
            fi

            echo "Push was rejected; will fetch the latest main and retry."
            sleep 2
          done

          echo "Could not push after 5 attempts."
          exit 1
